name = "auralis-relay"
main = "src/index.ts"
compatibility_date = "2026-09-19"

# Hibernation keeps an idle room at zero cost: the Durable Object is evicted
# between messages while its WebSockets stay open.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Without these, a live session that misbehaves leaves nothing behind to look at. Logs and traces
# are how a drift complaint from a real pair of phones turns into something diagnosable.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

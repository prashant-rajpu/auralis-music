name = "auralis-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Hibernation keeps an idle room at zero cost: the Durable Object is evicted
# between messages while its WebSockets stay open.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

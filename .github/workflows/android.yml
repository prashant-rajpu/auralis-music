name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # The relay is a separate Node service with its own toolchain, and it holds the rule that a
  # Together message can never carry a stream URL. Run its tests even on a commit that only touches
  # Kotlin: the two sides of the protocol have to keep agreeing.
  relay:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: relay/package-lock.json

    - name: Install
      working-directory: relay
      run: npm ci

    - name: Tests and typecheck
      working-directory: relay
      run: |
        npm test
        npm run typecheck

    - name: Build
      working-directory: relay
      run: npm run build

    # End to end, against a real process over real sockets. This used to need a deployment, so it
    # only ever ran by hand after one; a plain Node server can be started here instead.
    - name: Smoke test a running relay
      working-directory: relay
      run: |
        DATA_DIR="" PORT=8787 node dist/server.js &
        for _ in $(seq 1 30); do
          curl -sf http://127.0.0.1:8787/health >/dev/null && break
          sleep 1
        done
        npm run smoke -- http://127.0.0.1:8787

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Provide the Jamendo client id
      run: echo "AURALIS_JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" >> "$GITHUB_ENV"

    - name: Lint, unit tests, debug and release builds (both flavors)
      run: >-
        ./gradlew lint
        testPlayDebugUnitTest testPlusDebugUnitTest
        assemblePlayDebug assemblePlusDebug
        assemblePlayRelease assemblePlusRelease

    - name: Verify the play build contains no unofficial-endpoint code
      run: ./scripts/verify-play-flavor.sh

    - name: Upload debug APKs
      uses: actions/upload-artifact@v4
      with:
        name: auralis-debug-apks
        path: |
          app/build/outputs/apk/play/debug/app-play-debug.apk
          app/build/outputs/apk/plus/debug/app-plus-debug.apk

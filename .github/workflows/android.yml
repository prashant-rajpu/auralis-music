name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Provide the Jamendo client id
      run: echo "AURALIS_JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" >> "$GITHUB_ENV"

    - name: Lint, unit tests, debug and release builds (both flavors)
      run: >-
        ./gradlew lint
        testPlayDebugUnitTest testPlusDebugUnitTest
        assemblePlayDebug assemblePlusDebug
        assemblePlayRelease assemblePlusRelease

    - name: Verify the play build contains no unofficial-endpoint code
      run: ./scripts/verify-play-flavor.sh

    - name: Upload debug APKs
      uses: actions/upload-artifact@v4
      with:
        name: auralis-debug-apks
        path: |
          app/build/outputs/apk/play/debug/app-play-debug.apk
          app/build/outputs/apk/plus/debug/app-plus-debug.apk

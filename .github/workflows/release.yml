name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Decode release keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set - see docs/RELEASING.md"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

    - name: Unit tests and signed release build
      env:
        AURALIS_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        AURALIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        AURALIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        AURALIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew testPlusDebugUnitTest assemblePlusRelease

    - name: Package artifacts
      run: |
        APK=app/build/outputs/apk/plus/release/app-plus-release.apk
        if [ ! -f "$APK" ]; then
          echo "::error::Signed APK not found - check the KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets"
          ls -l app/build/outputs/apk/plus/release
          exit 1
        fi
        mkdir -p dist
        cp "$APK" "dist/auralis-${GITHUB_REF_NAME}.apk"
        (cd dist && sha256sum "auralis-${GITHUB_REF_NAME}.apk" > "auralis-${GITHUB_REF_NAME}.apk.sha256")
        cat dist/*.sha256

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
